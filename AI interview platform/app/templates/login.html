{% extends "base.html" %}

{% block title %}
Login - InterviewAI
{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="pill">
            YOUR AI COACH
        </div>

        <h1>
            Welcome back
        </h1>

        <p class="muted">
            Continue your interview preparation.
        </p>


        <form method="POST">

            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="you@example.com"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Your password"
                required
            >


            <button
                class="btn primary full"
                type="submit"
            >
                Login
            </button>

        </form>


        <p class="switch">

            New here?

            <a href="{{ url_for('auth.register') }}">
                Create an account
            </a>

        </p>

    </div>

</div>

{% endblock %}
